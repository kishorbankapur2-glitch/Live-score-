<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARELESS Live</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #ffd700;
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text-muted: rgba(240, 240, 240, 0.45);
}

body {
  margin: 0;
  padding: 2px 10px 80px; 
  background: #000;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  display: flex;
  justify-content: center;
}

.crex-card {
  width: 100%;
  max-width: 600px;
  background: #000;
  border-radius: 22px;
  border: 1px solid var(--glass-border);
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* HEADER */
.header {
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--glass-bg);
  border-bottom: 1px solid rgba(255, 215, 0, 0.15);
}

.brand {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 2px;
  line-height: 1.2;
}

.sub-live {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--accent);
  display: block;
  margin-top: 4px;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* COLOR BUTTON */
.color-btn {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.color-btn:active {
  transform: scale(0.8);
}

.live-tag {
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  border: 1px solid var(--accent);
  padding: 2px 8px;
  border-radius: 4px;
}

/* IFRAME BOX */
.iframe-box {
  width: 100%;
  height: 92vh;
  background: #000;
  overflow: hidden;
  position: relative;
}

.top-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 45px;
  background: #000;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  letter-spacing: 1px;
}

.score-frame {
  width: 100%;
  height: 145%;
  border: none;
  display: block;
  margin-top: -15px;
}

/* FOOTER */
.footer-info {
  padding: 12px 20px;
  background: rgba(0,0,0,0.9);
  border-top: 1px solid var(--glass-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
  position: relative;
}
</style>
</head>

<body>

<div class="crex-card">

  <div class="header">
    <div class="brand">
      Careless <br>
      <span class="sub-live">LIVE SCORE</span>
    </div>

    <div class="header-controls">
      <div class="color-btn" onclick="changeTheme()" title="Change Color"></div>
      <div class="live-tag">LIVE</div>
    </div>
  </div>

  <div class="iframe-box">
    <div class="top-overlay">
      YOU BORED WITH LOW SPEED? TRY OUR 🗿
    </div>

    <iframe 
      id="crexFrame" 
      class="score-frame" 
      src="https://crex.com/series/indian-premier-league-2026-1PW"
      allowfullscreen>
    </iframe>
  </div>

  <div class="footer-info">
    <div style="font-size: 11px; color: var(--text-muted);">
      Powered by Team Careless
    </div>

    <div onclick="location.reload()" 
         style="cursor:pointer; font-size:18px; color:var(--accent);">
      ↻
    </div>
  </div>

</div>

<script>
// Cycle through these colors
const themes = ['#ffd700', '#00d4ff', '#39ff14', '#ff00ff'];
let currentIdx = 0;

function changeTheme() {
  currentIdx = (currentIdx + 1) % themes.length;
  const newColor = themes[currentIdx];
  document.documentElement.style.setProperty('--accent', newColor);
  localStorage.setItem('carelessColor', newColor);
}

window.onload = () => {
  const saved = localStorage.getItem('carelessColor');
  if (saved) {
    document.documentElement.style.setProperty('--accent', saved);
    currentIdx = themes.indexOf(saved);
  }
};
</script>

</body>
</html>
