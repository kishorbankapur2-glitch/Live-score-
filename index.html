<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARELESS Live</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd700">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="photo.png">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #ffd700;
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text-muted: rgba(240, 240, 240, 0.45);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  display: flex;
  justify-content: center;
  padding: 10px;
}

.crex-card {
  width: 100%;
  max-width: 600px;
  background: #000;
  border-radius: 22px;
  border: 1px solid var(--glass-border);
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.header {
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--glass-bg);
  border-bottom: 1px solid rgba(255, 215, 0, 0.15);
}

.brand {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 2px;
  line-height: 1.2;
}

.sub-live {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--accent);
  display: block;
  margin-top: 4px;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.color-btn {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  cursor: pointer;
}

.commentary-btn-header {
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  border: 1px solid var(--accent);
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  background: transparent;
  transition: all 0.2s;
}

.commentary-btn-header.playing {
  background: var(--accent);
  color: #000;
}

.iframe-box {
  width: 100%;
  height: 85vh;
  background: #000;
  position: relative;
  overflow: hidden;
}

.top-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 45px;
  background: #000;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  letter-spacing: 1px;
  pointer-events: none;
}

.score-frame {
  width: 100%;
  height: 145%;
  border: none;
  display: block;
  margin-top: -15px;
}

.footer-info {
  padding: 12px 20px;
  background: rgba(0,0,0,0.9);
  border-top: 1px solid var(--glass-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.reload-btn {
  cursor: pointer;
  font-size: 18px;
  color: var(--accent);
}

.footer-text {
  font-size: 11px;
  color: var(--text-muted);
}
</style>
</head>
<body>

<div class="crex-card">
  <div class="header">
    <div class="brand">Careless <br><span class="sub-live">LIVE SCORE</span></div>
    <div class="header-controls">
      <div class="color-btn" onclick="changeTheme()"></div>
      <div class="commentary-btn-header" id="commentaryBtn" onclick="toggleCommentary()">🎧 COMMENTARY</div>
    </div>
  </div>

  <div class="iframe-box">
    <div class="top-overlay">YOU BORED WITH LOW SPEED? TRY OUR 🗿</div>
    <iframe id="crexFrame" class="score-frame" src="https://crex.com/series/indian-premier-league-2026-1PW" allowfullscreen></iframe>
  </div>

  <div class="footer-info">
    <div class="footer-text">Powered by Team Careless</div>
    <div class="reload-btn" onclick="location.reload()">↻</div>
  </div>
</div>

<script>
// 🔴🔴🔴 YAHAN APNA DAILY YOUTUBE LINK DALO 🔴🔴🔴
const COMMENTARY_URL = "https://www.youtube.com/live/dnpRUk2be84?si=bD-hRBjN3_3Vur82";
// 🔴🔴🔴 HAR DIN NAYA LINK YAHAN CHANGE KARO 🔴🔴🔴

let audioIframe = null;
let isPlaying = false;

// PWA Registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('PWA Ready'))
      .catch(err => console.log('SW Error', err));
  });
}

// Theme changer
const themes = ['#ffd700', '#00d4ff', '#39ff14', '#ff00ff'];
let currentIdx = 0;

function changeTheme() {
  currentIdx = (currentIdx + 1) % themes.length;
  document.documentElement.style.setProperty('--accent', themes[currentIdx]);
  localStorage.setItem('carelessColor', themes[currentIdx]);
}

// Get YouTube video ID
function getYouTubeId(url) {
  if (!url) return null;
  // Clean the URL first
  let cleanUrl = url.replace('m.youtube.com', 'youtube.com');
  const match = cleanUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/live\/)([^&?#]+)/);
  return match ? match[1] : null;
}

// Start commentary
function startCommentary() {
  const videoId = getYouTubeId(COMMENTARY_URL);
  if (!videoId) {
    alert('Invalid YouTube link! Please update COMMENTARY_URL in code.');
    return false;
  }
  
  if (audioIframe) {
    audioIframe.remove();
  }
  
  audioIframe = document.createElement('iframe');
  audioIframe.style.position = 'fixed';
  audioIframe.style.bottom = '-100px';
  audioIframe.style.left = '-100px';
  audioIframe.style.width = '1px';
  audioIframe.style.height = '1px';
  audioIframe.style.opacity = '0';
  audioIframe.style.pointerEvents = 'none';
  audioIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&disablekb=1&modestbranding=1&rel=0`;
  audioIframe.allow = 'autoplay';
  document.body.appendChild(audioIframe);
  
  isPlaying = true;
  updateButtonStyle(true);
  return true;
}

// Stop commentary
function stopCommentary() {
  if (audioIframe) {
    audioIframe.remove();
    audioIframe = null;
  }
  isPlaying = false;
  updateButtonStyle(false);
}

// Toggle - COMMENTARY BUTTON DABANE SE YAHI HOTA HAI
function toggleCommentary() {
  if (isPlaying) {
    stopCommentary();
  } else {
    startCommentary();
  }
}

// Button style update
function updateButtonStyle(playing) {
  const btn = document.getElementById('commentaryBtn');
  if (playing) {
    btn.classList.add('playing');
    btn.innerHTML = '🎧 ON AIR';
  } else {
    btn.classList.remove('playing');
    btn.innerHTML = '🎧 COMMENTARY';
  }
}

// Load saved theme
window.onload = () => {
  const saved = localStorage.getItem('carelessColor');
  if (saved) {
    document.documentElement.style.setProperty('--accent', saved);
    currentIdx = themes.indexOf(saved);
  }
};
</script>
</body>
</html>
