<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>CARELESS Live</title>  <style>  
  
/* PAGE BACKGROUND */  
  
body{  
background:#0d0d0d;  
margin:0;  
display:flex;  
justify-content:center;  
padding:14px;  
font-family:'Segoe UI', Arial, sans-serif;  
color:#e6e6e6;  
}  
  
/* MAIN CARD */  
  
.crex-card{  
width:100%;  
max-width:450px;  
background:#111;  
border-radius:18px;  
overflow:hidden;  
border:1px solid #ff2e2e33;  
position:relative;  
  
box-shadow:  
0 0 20px rgba(255,46,46,0.15),  
0 0 40px rgba(0,0,0,0.9);  
}  
  
/* HEADER */  
  
.header{  
background:linear-gradient(  
90deg,  
#7a1c1c,  
#a83232  
);  
  
color:#fff;  
padding:14px;  
font-weight:600;  
  
display:flex;  
justify-content:space-between;  
align-items:center;  
  
font-size:15px;  
  
box-shadow:  
0 2px 8px rgba(0,0,0,0.6);  
}  
  
/* LIVE BUTTON */  
  
.live-btn{  
background:#ff3b3b;  
color:white;  
  
padding:4px 12px;  
border-radius:8px;  
  
font-size:11px;  
font-weight:600;  
  
animation:blink 1s infinite;  
  
box-shadow:  
0 0 10px rgba(255,59,59,0.5);  
}  
  
@keyframes blink{  
50%{opacity:0.4;}  
}  
  
/* LIVE SCORE STRIP */  
  
.careless-strip{  
  
position:absolute;  
top:48px;  
height:55px;  
left:0;  
width:100%;  
  
background:#111;  
  
color:#ff4d4d;  
  
display:flex;  
align-items:center;  
justify-content:center;  
  
font-weight:900;  
font-size:20px;  
  
letter-spacing:4px;  
  
border-bottom:1px solid #ff2e2e33;  
  
z-index:10;  
  
cursor:pointer;  
  
transition:0.3s;  
  
}  
  
.careless-strip:hover{  
  
color:#ff7070;  
  
text-shadow:  
0 0 10px rgba(255,70,70,0.7);  
  
}  
  
/* IFRAME */  
  
.iframe-box{  
overflow:hidden;  
background:#000;  
}  
  
.score-frame{  
  
width:100%;  
height:900px;  
  
border:none;  
  
/* Hide banner */  
  
margin-top:-150px;  
  
filter:brightness(0.92);  
  
}  
  
/* FOOTER */  
  
.footer{  
  
padding:12px;  
  
font-size:12px;  
  
color:#999;  
  
text-align:center;  
  
background:#111;  
  
border-top:1px solid #ff2e2e33;  
  
letter-spacing:1px;  
  
}  
  
.footer span{  
  
color:#ff4d4d;  
  
font-weight:600;  
  
text-shadow:  
0 0 6px rgba(255,70,70,0.4);  
  
}  
  
</style>  </head>  <body>  <div class="crex-card">  <!-- HEADER -->  <div class="header">  
<span>  
CARELESS  
</span>  <span class="live-btn">  
LIVE  
</span>  
</div>  <!-- LIVE SCORE STRIP -->  <div class="careless-strip" onclick="restartApp()">  
LIVE SCORE  
</div>  <!-- IFRAME -->  <div class="iframe-box">  <iframe  
class="score-frame"  
id="crexFrame"  
src="https://crex.com/series/indian-premier-league-2026-1PW">  
</iframe>  </div>  <!-- FOOTER -->  <div class="footer">  
Powered by <span>Team Careless</span>  
</div>  </div>  <script>  
  
function restartApp(){  
location.reload();  
}  
  
</script>  </body>  
</html>
