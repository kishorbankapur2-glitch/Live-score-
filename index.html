<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CARELESS LIVE</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd700">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #ffd700;
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text-muted: rgba(240, 240, 240, 0.45);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 2px 10px 80px;
  background: #000;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.crex-card {
  width: 100%;
  max-width: 600px;
  background: #000;
  border-radius: 22px;
  border: 1px solid var(--glass-border);
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.header {
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--glass-bg);
  border-bottom: 1px solid rgba(255, 215, 0, 0.15);
}

.brand {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 2px;
  line-height: 1.2;
}

.sub-live {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--accent);
  display: block;
  margin-top: 4px;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.color-btn {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.live-tag {
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  border: 1px solid var(--accent);
  padding: 2px 8px;
  border-radius: 4px;
}

.iframe-box {
  width: 100%;
  height: 82vh;
  background: #000;
  overflow: hidden;
  position: relative;
}

.top-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 40px;
  background: linear-gradient(90deg, #000, rgba(0,0,0,0.8));
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  gap: 8px;
}

.top-overlay span {
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.score-frame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

.footer-info {
  padding: 12px 20px;
  background: rgba(0,0,0,0.95);
  border-top: 1px solid var(--glass-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
  position: relative;
}

.install-btn {
  background: var(--accent);
  border: none;
  padding: 8px 16px;
  border-radius: 25px;
  font-weight: bold;
  font-size: 12px;
  color: #000;
  cursor: pointer;
  display: none;
  transition: transform 0.2s;
  font-family: inherit;
}

.install-btn:hover {
  transform: scale(1.05);
}

.reload-btn {
  cursor: pointer;
  font-size: 20px;
  color: var(--accent);
  background: none;
  border: none;
  padding: 5px;
}

.offline-msg {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.9);
  color: #ffd700;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 12px;
  z-index: 1000;
  display: none;
  border: 1px solid #ffd700;
}

@media (max-width: 600px) {
  .iframe-box {
    height: 78vh;
  }
  .header {
    padding: 12px 16px;
  }
}
</style>
</head>
<body>

<div class="crex-card">
  <div class="header">
    <div class="brand">CARELESS <br><span class="sub-live">LIVE SCORE</span></div>
    <div class="header-controls">
      <div class="color-btn" onclick="changeTheme()"></div>
      <div class="live-tag">LIVE</div>
    </div>
  </div>

  <div class="iframe-box">
    <div class="top-overlay">
      <span>⚡</span> YOU BORED WITH LOW SPEED? TRY OUR VPN <span>⚡</span>
    </div>
    <iframe id="crexFrame" class="score-frame" src="https://crex.com/series/indian-premier-league-2026-1PW" allowfullscreen></iframe>
  </div>

  <div class="footer-info">
    <div style="font-size: 11px; color: var(--text-muted);">Powered by Team Careless</div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <button class="install-btn" id="installBtn">📱 INSTALL APP</button>
      <button class="reload-btn" onclick="location.reload()">↻</button>
    </div>
  </div>
</div>

<div id="offlineMsg" class="offline-msg">⚠️ You're offline - using cached content</div>

<script>
// ========== PWA INSTALLATION ==========
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const installBtn = document.getElementById('installBtn');
  installBtn.style.display = 'block';
  console.log('✅ Install prompt ready - tap install button');
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  
  if (outcome === 'accepted') {
    console.log('✅ User accepted install');
    document.getElementById('installBtn').style.display = 'none';
  } else {
    console.log('❌ User dismissed install');
  }
  deferredPrompt = null;
});

// ========== SERVICE WORKER REGISTRATION ==========
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('sw.js', {
        scope: '/'
      });
      console.log('✅ Service Worker registered:', registration.scope);
      
      // Check for updates
      registration.addEventListener('updatefound', () => {
        const newWorker = registration.installing;
        console.log('🔄 New service worker installing...');
        
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            console.log('🔄 Update available - refresh to load new version');
            showUpdateNotification();
          }
        });
      });
      
    } catch (error) {
      console.error('❌ Service Worker registration failed:', error);
    }
  });
  
  // Handle offline/online status
  window.addEventListener('online', () => {
    document.getElementById('offlineMsg').style.display = 'none';
    console.log('🟢 Online');
  });
  
  window.addEventListener('offline', () => {
    document.getElementById('offlineMsg').style.display = 'block';
    console.log('🔴 Offline - using cache');
  });
}

// ========== THEME MANAGEMENT ==========
const themes = ['#ffd700', '#00d4ff', '#39ff14', '#ff00ff', '#ff6b6b'];
let currentIdx = 0;

function changeTheme() {
  currentIdx = (currentIdx + 1) % themes.length;
  const newColor = themes[currentIdx];
  document.documentElement.style.setProperty('--accent', newColor);
  localStorage.setItem('carelessColor', newColor);
}

// Load saved theme
window.onload = () => {
  const saved = localStorage.getItem('carelessColor');
  if (saved) {
    document.documentElement.style.setProperty('--accent', saved);
    const savedIdx = themes.indexOf(saved);
    if (savedIdx !== -1) currentIdx = savedIdx;
  }
};

// ========== UPDATE NOTIFICATION ==========
function showUpdateNotification() {
  const notification = document.createElement('div');
  notification.style.cssText = `
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffd700;
    color: #000;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    z-index: 1001;
    cursor: pointer;
    animation: slideUp 0.3s ease;
  `;
  notification.innerHTML = '🔄 New version available! Click to update';
  notification.onclick = () => window.location.reload();
  document.body.appendChild(notification);
  
  setTimeout(() => {
    notification.remove();
  }, 10000);
}

// ========== CHECK IF ALREADY INSTALLED ==========
if (window.matchMedia('(display-mode: standalone)').matches) {
  console.log('✅ App is running in standalone mode (installed)');
  document.getElementById('installBtn').style.display = 'none';
}

// ========== IFRAME RELOAD ON ERROR ==========
const iframe = document.getElementById('crexFrame');
if (iframe) {
  iframe.onerror = () => {
    console.log('⚠️ Iframe load error');
    setTimeout(() => {
      iframe.src = iframe.src;
    }, 3000);
  };
}
</script>
</body>
</html>
