<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>CARELESS Live · Full Card Rotate 90° | Fixed Modes</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd700">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="photo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg-gradient-start: #0a0a0c;
  --bg-gradient-end: #000000;
  --card-bg: rgba(10, 10, 15, 0.72);
  --card-border: rgba(255, 255, 255, 0.07);
  --header-border: rgba(255, 215, 0, 0.15);
  --text-primary: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.55);
  --accent: #ffd700;
  --accent-glow: rgba(255, 215, 0, 0.5);
  --btn-bg: rgba(255, 255, 255, 0.04);
  --btn-border: rgba(255, 255, 255, 0.12);
  --footer-bg: rgba(0, 0, 0, 0.65);
  --modal-bg: rgba(18, 18, 24, 0.95);
  --hamburger-color: #ffd700;
}

body.light-mode {
  --bg-gradient-start: #f5f7fe;
  --bg-gradient-end: #e8ecf5;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-border: rgba(0, 0, 0, 0.08);
  --header-border: rgba(255, 215, 0, 0.3);
  --text-primary: #111111;
  --text-muted: rgba(0, 0, 0, 0.55);
  --accent: #d4a000;
  --accent-glow: rgba(212, 160, 0, 0.3);
  --btn-bg: rgba(0, 0, 0, 0.04);
  --btn-border: rgba(0, 0, 0, 0.1);
  --footer-bg: rgba(255, 255, 255, 0.85);
  --modal-bg: rgba(255, 255, 255, 0.96);
  --hamburger-color: #d4a000;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; }

body {
  background: radial-gradient(ellipse at 30% 20%, var(--bg-gradient-start), var(--bg-gradient-end));
  color: var(--text-primary);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 12px;
  overflow-y: auto;
  transition: background 0.3s ease, color 0.2s ease;
}

.app-container {
  width: 100%;
  display: flex;
  justify-content: center;
  transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

.app-container.mode-phone .crex-card  { max-width: 420px;  border-radius: 48px; }
.app-container.mode-tablet .crex-card { max-width: 720px;  border-radius: 36px; }
.app-container.mode-pc .crex-card     { max-width: 1100px; border-radius: 28px; }

@media (orientation: landscape) {
  .app-container.mode-phone .crex-card  { max-width: 98vw; border-radius: 24px; }
  .app-container.mode-tablet .crex-card { max-width: 98vw; border-radius: 24px; }
  .app-container.mode-pc .crex-card     { max-width: 99vw; border-radius: 20px; }
  .top-overlay { font-size: 10px; height: 36px; }

  .crex-card.split-active {
    display: flex;
    flex-direction: row;
    height: calc(100vh - 24px);
    overflow: hidden;
  }
  .crex-card.split-active .header      { display: none; }
  .crex-card.split-active .footer-info { display: none; }

  /* LEFT — video panel */
  .crex-card.split-active .video-panel {
    flex: 1;
    display: flex !important;
    flex-direction: column;
    max-height: none !important;
    height: 100% !important;
    border-right: 1px solid rgba(255,215,0,0.2);
    overflow: hidden;
  }
  .crex-card.split-active .video-close-bar {
    display: flex !important;
    height: 38px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,215,0,0.2);
    border-top: none;
  }
  .crex-card.split-active .video-aspect-wrap {
    flex: 1;
    height: 0 !important;
    min-height: 0;
    padding-top: 0 !important;
  }
  .crex-card.split-active .live-video-frame {
    position: absolute;
    top: 0; left: 0;
    transform-origin: top left !important;
  }

  /* RIGHT — crex panel */
  .crex-card.split-active .iframe-box {
    flex: 1;
    height: 100% !important;
    overflow: hidden;
    position: relative;
  }
  /* overlay covers crex navbar */
  .crex-card.split-active .top-overlay {
    position: absolute !important;
    top: 0; left: 0;
    width: 100%;
    height: 52px !important;
    z-index: 30;
    pointer-events: none;
    font-size: 10px;
    letter-spacing: 1px;
    background: rgba(0,0,0,0.92) !important;
  }
  .crex-card.split-active .score-frame {
    width: 100%;
    height: 100% !important;
    margin-top: 0 !important;
  }
}

.rotate-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
  width: 100%;
}
.rotate-wrapper.rotated-90 { transform: rotate(90deg); }
body:has(.rotate-wrapper.rotated-90) { overflow-x: visible; overflow-y: visible; }

.crex-card {
  width: 100%;
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--card-border);
  box-shadow: 0 30px 50px -20px rgba(0,0,0,0.3), 0 0 0 0.5px rgba(255,215,0,0.15);
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.2,0.9,0.4,1.1), background 0.2s, max-width 0.2s;
}

.header {
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--header-border);
  flex-wrap: nowrap;
}

.brand {
  font-family: 'Syne','Inter',sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.02em;
  background: linear-gradient(145deg, var(--text-primary) 20%, var(--accent) 90%);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  line-height: 1.2;
}
.sub-live {
  font-size: 9px; font-weight: 700; letter-spacing: 0.9px;
  color: var(--accent); display: block; text-transform: uppercase;
  font-family: 'Inter', monospace; opacity: 0.95;
}

.header-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 1; }

.commentary-btn-header, .watch-live-btn {
  height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 999px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; font-size: 11px;
  transition: all 0.2s cubic-bezier(0.2,0.9,0.4,1.1);
  cursor: pointer; background: var(--btn-bg); backdrop-filter: blur(4px);
  border: 1px solid var(--btn-border); white-space: nowrap;
  text-decoration: none; padding: 0 16px; font-family: 'Inter', sans-serif;
}
.watch-live-btn {
  background: rgba(255,59,48,0.12);
  border: 1px solid rgba(255,59,48,0.4);
  color: #ff5e55; font-weight: 700;
}
.watch-live-btn:active { transform: scale(0.97); }
.commentary-btn-header { color: var(--accent); }
.commentary-btn-header.playing {
  background: var(--accent); color: #0a0a0a;
  border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow);
}

/* ===== VIDEO PANEL ===== */
.video-panel {
  width: 100%; background: #000; overflow: hidden;
  max-height: 0; transition: max-height 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  position: relative;
}
.video-panel.open { max-height: 25vh; }

.video-aspect-wrap {
  position: relative; width: 100%; height: 25vh;
  background: #000; overflow: hidden;
}

.app-container.mode-tablet .video-panel.open  { max-height: 30vh; }
.app-container.mode-tablet .video-aspect-wrap { height: 30vh; }
.app-container.mode-pc .video-panel.open      { max-height: 35vh; }
.app-container.mode-pc .video-aspect-wrap     { height: 35vh; }

.live-video-frame {
  position: absolute; top: 0; left: 0;
  width: 1390px; height: 900px;
  border: none; display: block; transform-origin: top left;
}

.video-close-bar {
  width: 100%; height: 30px;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; border-bottom: 1px solid rgba(255,215,0,0.15);
}
.video-close-label {
  font-size: 9px; font-weight: 700; letter-spacing: 1px;
  color: var(--accent); text-transform: uppercase; font-family: 'Inter', monospace;
}
.video-close-btn {
  font-size: 12px; color: var(--text-muted); cursor: pointer;
  padding: 4px 8px; border-radius: 6px; transition: color 0.2s;
  background: none; border: none; line-height: 1; font-family: 'Inter', sans-serif;
}
.video-close-btn:active { color: var(--accent); }

/* ===== CREX ===== */
.iframe-box {
  width: 100%; background: #000; position: relative;
  overflow: hidden; transition: height 0.25s ease;
}
.top-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 44px;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
  z-index: 20; display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-weight: 600; font-size: 10px;
  letter-spacing: 0.9px; text-transform: uppercase; pointer-events: none;
  border-bottom: 1px solid rgba(255,215,0,0.25); font-family: 'Inter', monospace;
}
.score-frame {
  width: 100%; height: 145%; border: none; display: block; margin-top: -15px;
}

/* ===== FOOTER ===== */
.footer-info {
  padding: 12px 20px; background: var(--footer-bg); backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
}
.footer-left { display: flex; align-items: center; gap: 12px; }
.menu-trigger {
  width: 36px; height: 36px; border-radius: 999px;
  background: var(--btn-bg); border: 1px solid var(--btn-border);
  display: grid; place-items: center; cursor: pointer; transition: all 0.2s ease;
}
.menu-trigger:active { transform: scale(0.94); }
.hamburger-icon { width: 18px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; }
.hamburger-icon span { display: block; height: 2px; width: 100%; background: var(--hamburger-color); border-radius: 2px; transition: background 0.2s; }
.footer-text { font-size: 10px; font-weight: 500; letter-spacing: 0.3px; color: var(--text-muted); font-family: 'Inter', monospace; }
.reload-btn {
  width: 38px; height: 38px; background: var(--btn-bg); border-radius: 999px;
  border: 1px solid var(--btn-border); display: grid; place-items: center;
  cursor: pointer; transition: all 0.2s ease; font-size: 20px; color: var(--accent); backdrop-filter: blur(4px);
}
.reload-btn:active { transform: scale(0.95); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.25s ease;
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-card {
  background: var(--modal-bg); backdrop-filter: blur(20px);
  border-radius: 48px; border: 1px solid var(--accent); width: 300px;
  padding: 24px 20px; text-align: center; box-shadow: 0 25px 45px rgba(0,0,0,0.3);
  transform: scale(0.95); transition: transform 0.2s ease, background 0.2s;
}
.modal-overlay.active .modal-card { transform: scale(1); }
.modal-card h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; color: var(--accent); margin-bottom: 16px; letter-spacing: -0.3px; }
.modal-divider { height: 1px; background: var(--btn-border); margin: 16px 0; }
.mode-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px; font-weight: 600; }
.mode-option {
  background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 999px;
  padding: 10px 16px; margin: 8px 0; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; font-weight: 600; font-size: 14px; color: var(--text-primary);
}
.mode-option:active { transform: scale(0.97); background: rgba(255,215,0,0.15); border-color: var(--accent); }
.theme-toggle-option {
  background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 999px;
  padding: 10px 16px; margin: 8px 0; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 600; font-size: 14px; color: var(--text-primary);
}
.theme-toggle-option:active { transform: scale(0.97); }
.theme-toggle-option span:first-child { display: flex; align-items: center; gap: 10px; }
.theme-badge { font-size: 11px; background: var(--accent); color: #000; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
.rotate-card-option {
  background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 999px;
  padding: 10px 16px; margin: 8px 0; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 600; font-size: 14px; color: var(--text-primary);
}
.rotate-card-option:active { transform: scale(0.97); }
.rotate-card-option span:first-child { display: flex; align-items: center; gap: 10px; }
.rotate-badge { font-size: 11px; background: var(--accent); color: #000; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
.rotate-badge.active { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
.close-modal { margin-top: 16px; background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; padding: 8px; }

@media (max-width: 520px) {
  .header { padding: 10px 14px; }
  .commentary-btn-header, .watch-live-btn { padding: 0 12px; font-size: 9px; height: 36px; }
  .brand { font-size: 15px; }
  .top-overlay { font-size: 8px; height: 38px; }
  .footer-info { padding: 10px 16px; }
  .menu-trigger { width: 32px; height: 32px; }
  .modal-card { width: 280px; padding: 20px 16px; }
}

.mode-option:hover, .theme-toggle-option:hover, .rotate-card-option:hover { background: rgba(255,215,0,0.15); border-color: var(--accent); }
</style>
</head>
<body>

<div class="app-container mode-phone" id="appContainer">
  <div class="rotate-wrapper" id="rotateWrapper">
    
    <div class="crex-card">
      <div class="header">
        <div class="brand">CARELESS <br><span class="sub-live">LIVE SCORE</span></div>
        <div class="header-controls">
          <div class="watch-live-btn" id="watchLiveBtn" onclick="toggleVideoPanel()">📺 LIVE STREAM</div>
          <div class="commentary-btn-header" id="commentaryBtn" onclick="toggleCommentary()">🎧 AUDIO</div>
        </div>
      </div>

      <div class="video-panel" id="videoPanel">
        <div class="video-aspect-wrap">
          <iframe id="liveVideoFrame" class="live-video-frame" src=""
            allowfullscreen allow="autoplay; encrypted-media; fullscreen" scrolling="no"></iframe>
        </div>
        <div class="video-close-bar">
          <span class="video-close-label">📺 LIVE STREAM</span>
          <button class="video-close-btn" onclick="closeVideoPanel()">✕ Close</button>
        </div>
      </div>

      <div class="iframe-box" id="iframeBox">
        <div class="top-overlay" id="topOverlay">⚡ YOU BORED WITH LOW SPEED? TRY OUR 🗿</div>
        <iframe id="crexFrame" class="score-frame" src="https://crex.com/series/indian-premier-league-2026-1PW" allowfullscreen></iframe>
      </div>

      <div class="footer-info">
        <div class="footer-left">
          <div class="menu-trigger" id="menuTrigger">
            <div class="hamburger-icon"><span></span><span></span><span></span></div>
          </div>
          <div class="footer-text">Powered by Team Careless</div>
        </div>
        <div class="reload-btn" onclick="location.reload()" aria-label="reload">↻</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modeModal">
  <div class="modal-card">
    <h3>⚙️ CARELESS MENU</h3>
    <div class="mode-section-title">📱 DISPLAY SIZE</div>
    <div class="mode-option" data-mode="phone"><span>📱</span> Phone · Compact</div>
    <div class="mode-option" data-mode="tablet"><span>📟</span> Tablet · Wide</div>
    <div class="mode-option" data-mode="pc"><span>🖥️</span> PC · Cinema</div>
    <div class="modal-divider"></div>
    <div class="mode-section-title">🎨 APPEARANCE</div>
    <div class="theme-toggle-option" id="themeToggleModal">
      <span>🌓 Dark / Light Mode</span>
      <span class="theme-badge" id="themeBadge">DARK</span>
    </div>
    <div class="rotate-card-option" id="rotateCardOption">
      <span>🔄 Rotate Full Card 90°</span>
      <span class="rotate-badge" id="rotateBadge">OFF</span>
    </div>
    <div class="close-modal" id="closeModal">✕ close</div>
  </div>
</div>

<script>
const COMMENTARY_URL = "https://www.youtube.com/live/W42OdjZaHB4?si=WTN3Bx_iJSE83uRX";
const LIVE_STREAM_URL = "https://cric-hd-tv.pages.dev/?id=eng";

let audioIframe = null, isPlaying = false, currentMode = 'phone';
let resizeDebounceTimer = null, isVideoOpen = false, isCardRotated = false;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

function toggleVideoPanel() { isVideoOpen ? closeVideoPanel() : openVideoPanel(); }
function isLandscapeNow() { return window.innerWidth > window.innerHeight; }

function applySplitOrStack() {
  const card = document.querySelector('.crex-card');
  const overlay = document.getElementById('topOverlay');
  if (!card) return;
  if (isVideoOpen && isLandscapeNow()) {
    card.classList.add('split-active');
    if (overlay) overlay.innerText = '⚡ CARELESS · LIVE SCORE 🏏';
    setTimeout(() => {
      const wrap = document.querySelector('.video-aspect-wrap');
      const frame = document.getElementById('liveVideoFrame');
      if (!wrap || !frame) return;
      const panelW = wrap.offsetWidth;
      const scale = panelW / 890;
      const tx = -(250 * scale);
      const ty = -(130 * scale);
      frame.style.width = '1390px';
      frame.style.height = '900px';
      frame.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      frame.style.transformOrigin = 'top left';
    }, 80);
  } else {
    card.classList.remove('split-active');
    if (overlay) overlay.innerText = '⚡ YOU BORED WITH LOW SPEED? TRY OUR 🗿';
  }
  setTimeout(applyIframeHeight, 50);
}

function openVideoPanel() {
  const panel = document.getElementById('videoPanel');
  const frame = document.getElementById('liveVideoFrame');
  const btn = document.getElementById('watchLiveBtn');
  if (!frame.src || frame.src === window.location.href || frame.src === '') {
    frame.src = LIVE_STREAM_URL;
  }
  panel.classList.add('open');
  isVideoOpen = true;
  applySplitOrStack();
  setTimeout(scaleVideoFrame, 50);
  setTimeout(scaleVideoFrame, 450);
  setTimeout(scaleVideoFrame, 1000);
  setTimeout(scaleVideoFrame, 2500);
  btn.innerHTML = '📺 CLOSE VIDEO';
  btn.style.background = 'rgba(255,215,0,0.15)';
  btn.style.borderColor = 'var(--accent)';
  btn.style.color = 'var(--accent)';
  setTimeout(applyIframeHeight, 420);
}

function closeVideoPanel() {
  const panel = document.getElementById('videoPanel');
  const frame = document.getElementById('liveVideoFrame');
  const btn = document.getElementById('watchLiveBtn');
  const card = document.querySelector('.crex-card');
  const overlay = document.getElementById('topOverlay');
  panel.classList.remove('open');
  card.classList.remove('split-active');
  isVideoOpen = false;
  if (overlay) overlay.innerText = '⚡ YOU BORED WITH LOW SPEED? TRY OUR 🗿';
  setTimeout(() => { frame.src = ''; }, 400);
  btn.innerHTML = '📺 LIVE STREAM';
  btn.style.background = '';
  btn.style.borderColor = '';
  btn.style.color = '';
  setTimeout(applyIframeHeight, 420);
}

function applyFullCardRotation(rotateState) {
  const wrapper = document.getElementById('rotateWrapper');
  const badge = document.getElementById('rotateBadge');
  if (!wrapper) return;
  if (rotateState) {
    wrapper.classList.add('rotated-90');
    if (badge) { badge.innerText = '90° ✓'; badge.classList.add('active'); }
    document.body.style.overflowX = 'visible';
    document.body.style.overflowY = 'visible';
  } else {
    wrapper.classList.remove('rotated-90');
    if (badge) { badge.innerText = 'OFF'; badge.classList.remove('active'); }
    document.body.style.overflowX = '';
    document.body.style.overflowY = '';
  }
  setTimeout(() => {
    applyIframeHeight();
    const iframe = document.getElementById('crexFrame');
    if (iframe) { iframe.style.opacity = '0.99'; setTimeout(() => { if(iframe) iframe.style.opacity = '1'; }, 60); }
  }, 50);
}
function setCardRotationState(rotated) {
  isCardRotated = rotated;
  localStorage.setItem('carelessFullCardRotated', rotated ? '1' : '0');
  applyFullCardRotation(isCardRotated);
}
window.toggleFullCardRotation = function() { setCardRotationState(!isCardRotated); };
function loadCardRotationFromStorage() {
  setCardRotationState(localStorage.getItem('carelessFullCardRotated') === '1');
}

function getIframeHeight() {
  const W = window.innerWidth, H = window.innerHeight;
  const isLandscape = W > H;
  const ratios = { phone: 0.78, tablet: 0.70, pc: 0.75 };
  const ratio = ratios[currentMode] || 0.78;
  if (isLandscape) {
    return Math.max(180, H - (isVideoOpen ? 150 : 110)) + 'px';
  } else {
    return Math.floor(H * (isVideoOpen ? ratio * 0.72 : ratio)) + 'px';
  }
}
function applyIframeHeight() {
  const box = document.getElementById('iframeBox');
  if (box) box.style.height = getIframeHeight();
}
function applyMode(mode) {
  const container = document.getElementById('appContainer');
  container.classList.remove('mode-phone', 'mode-tablet', 'mode-pc');
  container.classList.add(`mode-${mode}`);
  currentMode = mode;
  localStorage.setItem('displayMode', mode);
  applyIframeHeight();
  const card = document.querySelector('.crex-card');
  if (card) { card.style.transform = 'scale(0.99)'; setTimeout(() => { if(card) card.style.transform = ''; }, 150); }
}
function handleLayoutChange() {
  applyIframeHeight();
  const iframe = document.getElementById('crexFrame');
  if (iframe) { iframe.style.opacity = '0.99'; setTimeout(() => { if(iframe) iframe.style.opacity = '1'; }, 80); }
}
function debouncedLayoutChange() {
  clearTimeout(resizeDebounceTimer);
  resizeDebounceTimer = setTimeout(handleLayoutChange, 80);
}

function scaleVideoFrame() {
  const wrap = document.querySelector('.video-aspect-wrap');
  const frame = document.getElementById('liveVideoFrame');
  if (!wrap || !frame) return;
  if (isLandscapeNow() && isVideoOpen) return;
  const containerW = wrap.offsetWidth;
  const scale = containerW / 890;
  const translateX = -(250 * scale);
  const translateY = -(130 * scale);
  frame.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  frame.style.transformOrigin = 'top left';
  try { frame.contentWindow.scrollTo(0, 0); } catch(e) {}
}

window.addEventListener('resize', () => {
  if (isVideoOpen) { applySplitOrStack(); scaleVideoFrame(); }
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => { handleLayoutChange(); if (isVideoOpen) applySplitOrStack(); }, 150);
  setTimeout(() => { handleLayoutChange(); if (isVideoOpen) applySplitOrStack(); }, 400);
});
if (screen.orientation) {
  screen.orientation.addEventListener('change', () => {
    setTimeout(() => { handleLayoutChange(); if (isVideoOpen) applySplitOrStack(); }, 150);
  });
}

function setTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light-mode');
    localStorage.setItem('carelessTheme', 'light');
    const badge = document.getElementById('themeBadge');
    if (badge) badge.innerText = 'LIGHT';
  } else {
    document.body.classList.remove('light-mode');
    localStorage.setItem('carelessTheme', 'dark');
    const badge = document.getElementById('themeBadge');
    if (badge) badge.innerText = 'DARK';
  }
  updateButtonStyle(isPlaying);
}
function toggleTheme() { setTheme(document.body.classList.contains('light-mode') ? 'dark' : 'light'); }

const menuBtn = document.getElementById('menuTrigger');
const modal = document.getElementById('modeModal');
const closeModalBtn = document.getElementById('closeModal');
function openModal()  { modal.classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }
menuBtn.addEventListener('click', openModal);
closeModalBtn.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.querySelectorAll('.mode-option').forEach(option => {
  option.addEventListener('click', () => {
    const mode = option.getAttribute('data-mode');
    if (mode) { applyMode(mode); closeModal(); }
  });
});
document.getElementById('themeToggleModal').addEventListener('click', toggleTheme);
const rotateCardOpt = document.getElementById('rotateCardOption');
if (rotateCardOpt) {
  rotateCardOpt.addEventListener('click', (e) => { e.stopPropagation(); toggleFullCardRotation(); });
}

function getYouTubeId(url) {
  if (!url) return null;
  const cleanUrl = url.replace('m.youtube.com', 'youtube.com');
  const match = cleanUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/live\/)([^&?#]+)/);
  return match ? match[1] : null;
}
function startCommentary() {
  const videoId = getYouTubeId(COMMENTARY_URL);
  if (!videoId) { alert('⚠️ Please update daily YouTube commentary link.'); return; }
  if (audioIframe) audioIframe.remove();
  audioIframe = document.createElement('iframe');
  Object.assign(audioIframe.style, {
    position: 'fixed', bottom: '-100px', left: '-100px',
    width: '1px', height: '1px', opacity: '0', pointerEvents: 'none', border: 'none'
  });
  audioIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&disablekb=1&modestbranding=1&rel=0&playsinline=1`;
  audioIframe.allow = 'autoplay; encrypted-media';
  document.body.appendChild(audioIframe);
  isPlaying = true;
  updateButtonStyle(true);
}
function stopCommentary() {
  if (audioIframe) { audioIframe.remove(); audioIframe = null; }
  isPlaying = false;
  updateButtonStyle(false);
}
function toggleCommentary() { isPlaying ? stopCommentary() : startCommentary(); }
function updateButtonStyle(playing) {
  const btn = document.getElementById('commentaryBtn');
  if (!btn) return;
  if (playing) {
    btn.classList.add('playing');
    btn.innerHTML = '🎧 ON AIR';
    btn.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ffd700';
    btn.style.color = '#0a0a0a';
  } else {
    btn.classList.remove('playing');
    btn.innerHTML = '🎧 AUDIO';
    btn.style.backgroundColor = '';
    btn.style.color = 'var(--accent)';
  }
}

window.onload = () => {
  const savedMode = localStorage.getItem('displayMode');
  const validModes = ['phone', 'tablet', 'pc'];
  applyMode(validModes.includes(savedMode) ? savedMode : 'phone');
  setTheme(localStorage.getItem('carelessTheme') === 'light' ? 'light' : 'dark');
  loadCardRotationFromStorage();
  document.querySelectorAll('.commentary-btn-header, .watch-live-btn, .reload-btn, .menu-trigger, .rotate-card-option').forEach(btn => {
    ['touchstart','mousedown'].forEach(ev => btn.addEventListener(ev, () => btn.style.transform = 'scale(0.97)', {passive:true}));
    ['touchend','mouseup','touchcancel','mouseleave'].forEach(ev => btn.addEventListener(ev, () => btn.style.transform = ''));
  });
  handleLayoutChange();
};

window.addEventListener('beforeunload', () => { if (audioIframe) audioIframe.remove(); });
window.toggleCommentary = toggleCommentary;
</script>
</body>
</html>
