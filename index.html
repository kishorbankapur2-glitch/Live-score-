<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>CARELESS Live · Auto Rotation | Dual Modes</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd700">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="photo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg-gradient-start: #0a0a0c;
  --bg-gradient-end: #000000;
  --card-bg: rgba(10, 10, 15, 0.72);
  --card-border: rgba(255, 255, 255, 0.07);
  --header-border: rgba(255, 215, 0, 0.15);
  --text-primary: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.55);
  --accent: #ffd700;
  --accent-glow: rgba(255, 215, 0, 0.5);
  --btn-bg: rgba(255, 255, 255, 0.04);
  --btn-border: rgba(255, 255, 255, 0.12);
  --footer-bg: rgba(0, 0, 0, 0.65);
  --modal-bg: rgba(18, 18, 24, 0.95);
  --hamburger-color: #ffd700;
}

body.light-mode {
  --bg-gradient-start: #f5f7fe;
  --bg-gradient-end: #e8ecf5;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-border: rgba(0, 0, 0, 0.08);
  --header-border: rgba(255, 215, 0, 0.3);
  --text-primary: #111111;
  --text-muted: rgba(0, 0, 0, 0.55);
  --accent: #d4a000;
  --accent-glow: rgba(212, 160, 0, 0.3);
  --btn-bg: rgba(0, 0, 0, 0.04);
  --btn-border: rgba(0, 0, 0, 0.1);
  --footer-bg: rgba(255, 255, 255, 0.85);
  --modal-bg: rgba(255, 255, 255, 0.96);
  --hamburger-color: #d4a000;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  /* FIX: Use 100% instead of 100vh to avoid Android Chrome toolbar bug */
  height: 100%;
  width: 100%;
}

body {
  background: radial-gradient(ellipse at 30% 20%, var(--bg-gradient-start), var(--bg-gradient-end));
  color: var(--text-primary);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  /* FIX: min-height uses dvh (dynamic viewport height) with px fallback */
  min-height: 100px;
  padding: 12px;
  transition: background 0.3s ease, color 0.2s ease;
}

.app-container {
  width: 100%;
  display: flex;
  justify-content: center;
  transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

.mode-phone .crex-card  { max-width: 420px; border-radius: 48px; }
.mode-tablet .crex-card { max-width: 720px; border-radius: 36px; }
.mode-pc .crex-card     { max-width: 1100px; border-radius: 28px; }

/* FIX: CSS media query still works as fallback, but JS now drives height via px not vh */
@media (orientation: landscape) {
  .mode-phone .crex-card  { max-width: 90vw; border-radius: 32px; }
  .mode-tablet .crex-card { max-width: 94vw; }
  .mode-pc .crex-card     { max-width: 96vw; }
  .top-overlay { font-size: 10px; height: 36px; }
}

.crex-card {
  width: 100%;
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--card-border);
  box-shadow: 0 30px 50px -20px rgba(0,0,0,0.3), 0 0 0 0.5px rgba(255,215,0,0.15);
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.2,0.9,0.4,1.1), background 0.2s, max-width 0.2s;
}

.header {
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--header-border);
  flex-wrap: nowrap;
}

.brand {
  font-family: 'Syne','Inter',sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.02em;
  background: linear-gradient(145deg, var(--text-primary) 20%, var(--accent) 90%);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  line-height: 1.2;
}

.sub-live {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.9px;
  color: var(--accent);
  display: block;
  text-transform: uppercase;
  font-family: 'Inter', monospace;
  opacity: 0.95;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 1;
}

.commentary-btn-header,
.watch-live-btn {
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-size: 11px;
  transition: all 0.2s cubic-bezier(0.2,0.9,0.4,1.1);
  cursor: pointer;
  background: var(--btn-bg);
  backdrop-filter: blur(4px);
  border: 1px solid var(--btn-border);
  white-space: nowrap;
  text-decoration: none;
  padding: 0 16px;
  font-family: 'Inter', sans-serif;
}

.watch-live-btn {
  background: rgba(255,59,48,0.12);
  border: 1px solid rgba(255,59,48,0.4);
  color: #ff5e55;
  font-weight: 700;
}

.watch-live-btn:active { transform: scale(0.97); }
.commentary-btn-header { color: var(--accent); }
.commentary-btn-header.playing {
  background: var(--accent);
  color: #0a0a0a;
  border-color: var(--accent);
  box-shadow: 0 0 14px var(--accent-glow);
}

/* ===== IFRAME BOX: FIX - height set purely by JS using window.innerHeight px ===== */
.iframe-box {
  width: 100%;
  /* FIX: No vh here. JS will set height in px using actual window.innerHeight */
  background: #000;
  position: relative;
  overflow: hidden;
  transition: height 0.25s ease;
}

.top-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 44px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(12px);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  pointer-events: none;
  border-bottom: 1px solid rgba(255,215,0,0.25);
  font-family: 'Inter', monospace;
}

.score-frame {
  width: 100%;
  height: 145%;
  border: none;
  display: block;
  margin-top: -15px;
}

.footer-info {
  padding: 12px 20px;
  background: var(--footer-bg);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.2s;
}

.footer-left { display: flex; align-items: center; gap: 12px; }

.menu-trigger {
  width: 36px; height: 36px;
  border-radius: 999px;
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  display: grid; place-items: center;
  cursor: pointer;
  transition: all 0.2s ease;
}
.menu-trigger:active { transform: scale(0.94); }

.hamburger-icon {
  width: 18px; height: 14px;
  display: flex; flex-direction: column;
  justify-content: space-between;
}
.hamburger-icon span {
  display: block; height: 2px; width: 100%;
  background: var(--hamburger-color);
  border-radius: 2px;
  transition: background 0.2s;
}

.footer-text {
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.3px;
  color: var(--text-muted);
  font-family: 'Inter', monospace;
}

.reload-btn {
  width: 38px; height: 38px;
  background: var(--btn-bg);
  border-radius: 999px;
  border: 1px solid var(--btn-border);
  display: grid; place-items: center;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 20px;
  color: var(--accent);
  backdrop-filter: blur(4px);
}
.reload-btn:active { transform: scale(0.95); }

.modal-overlay {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: all 0.25s ease;
}
.modal-overlay.active { opacity: 1; visibility: visible; }

.modal-card {
  background: var(--modal-bg);
  backdrop-filter: blur(20px);
  border-radius: 48px;
  border: 1px solid var(--accent);
  width: 300px;
  padding: 24px 20px;
  text-align: center;
  box-shadow: 0 25px 45px rgba(0,0,0,0.3);
  transform: scale(0.95);
  transition: transform 0.2s ease, background 0.2s;
}
.modal-overlay.active .modal-card { transform: scale(1); }

.modal-card h3 {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 18px;
  color: var(--accent);
  margin-bottom: 16px;
  letter-spacing: -0.3px;
}
.modal-divider { height: 1px; background: var(--btn-border); margin: 16px 0; }
.mode-section-title {
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-muted);
  margin-bottom: 10px; font-weight: 600;
}
.mode-option {
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  border-radius: 999px;
  padding: 10px 16px; margin: 8px 0;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; font-weight: 600; font-size: 14px;
  color: var(--text-primary);
}
.mode-option:active { transform: scale(0.97); background: rgba(255,215,0,0.15); border-color: var(--accent); }

.theme-toggle-option {
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  border-radius: 999px;
  padding: 10px 16px; margin: 8px 0;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 600; font-size: 14px;
  color: var(--text-primary);
}
.theme-toggle-option:active { transform: scale(0.97); }
.theme-toggle-option span:first-child { display: flex; align-items: center; gap: 10px; }
.theme-badge {
  font-size: 11px; background: var(--accent); color: #000;
  padding: 4px 10px; border-radius: 999px; font-weight: 700;
}
.close-modal {
  margin-top: 16px; background: transparent; border: none;
  color: var(--text-muted); font-size: 12px; cursor: pointer; padding: 8px;
}

@media (max-width: 520px) {
  .header { padding: 10px 14px; }
  .commentary-btn-header, .watch-live-btn { padding: 0 12px; font-size: 9px; height: 36px; }
  .brand { font-size: 15px; }
  .top-overlay { font-size: 8px; height: 38px; }
  .footer-info { padding: 10px 16px; }
  .menu-trigger { width: 32px; height: 32px; }
  .modal-card { width: 280px; padding: 20px 16px; }
}

.mode-option:hover, .theme-toggle-option:hover { background: rgba(255,215,0,0.15); border-color: var(--accent); }
</style>
</head>
<body>

<div class="app-container mode-phone" id="appContainer">
  <div class="crex-card">
    <div class="header">
      <div class="brand">CARELESS <br><span class="sub-live">LIVE SCORE</span></div>
      <div class="header-controls">
        <a href="https://www.hotstar.com/in/sports/cricket/pbks-vs-lsg/1540066382/video/live/watch" target="_blank" rel="noopener noreferrer" class="watch-live-btn">LIVE STREAM</a>
        <div class="commentary-btn-header" id="commentaryBtn" onclick="toggleCommentary()">🎧 AUDIO</div>
      </div>
    </div>

    <div class="iframe-box" id="iframeBox">
      <div class="top-overlay">⚡ YOU BORED WITH LOW SPEED? TRY OUR 🗿</div>
      <iframe id="crexFrame" class="score-frame" src="https://crex.com/series/indian-premier-league-2026-1PW" allowfullscreen></iframe>
    </div>

    <div class="footer-info">
      <div class="footer-left">
        <div class="menu-trigger" id="menuTrigger">
          <div class="hamburger-icon"><span></span><span></span><span></span></div>
        </div>
        <div class="footer-text">Powered by Team Careless</div>
      </div>
      <div class="reload-btn" onclick="location.reload()" aria-label="reload">↻</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modeModal">
  <div class="modal-card">
    <h3>⚙️ CARELESS MENU</h3>
    <div class="mode-section-title">📱 DISPLAY SIZE</div>
    <div class="mode-option" data-mode="phone"><span>📱</span> Phone · Compact</div>
    <div class="mode-option" data-mode="tablet"><span>📟</span> Tablet · Wide</div>
    <div class="mode-option" data-mode="pc"><span>🖥️</span> PC · Cinema</div>
    <div class="modal-divider"></div>
    <div class="mode-section-title">🎨 APPEARANCE</div>
    <div class="theme-toggle-option" id="themeToggleModal">
      <span>🌓 Dark / Light Mode</span>
      <span class="theme-badge" id="themeBadge">DARK</span>
    </div>
    <div class="close-modal" id="closeModal">✕ close</div>
  </div>
</div>

<script>
// ========== DAILY YOUTUBE AUDIO COMMENTARY LINK ==========
const COMMENTARY_URL = "https://www.youtube.com/live/W42OdjZaHB4?si=WTN3Bx_iJSE83uRX";

let audioIframe = null;
let isPlaying = false;
let currentMode = 'phone';
let resizeDebounceTimer = null;

// PWA Registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// =====================================================================
// FIX: Use window.innerHeight in px instead of vh units.
// Android Chrome in landscape shrinks innerHeight correctly but 100vh
// does NOT update (it stays portrait height). This is the root cause.
// =====================================================================
function getIframeHeight() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const isLandscape = W > H;

  // Reserve pixels for header (~54px) + footer (~62px) + overlay (~44px) + padding
  const reserved = isLandscape ? 140 : 160;

  // Base ratio by mode
  let ratio;
  if (currentMode === 'phone') {
    ratio = isLandscape ? 0.88 : 0.72;
  } else if (currentMode === 'tablet') {
    ratio = isLandscape ? 0.82 : 0.65;
  } else { // pc
    ratio = isLandscape ? 0.85 : 0.70;
  }

  const calculated = Math.max(200, Math.floor(H * ratio) - reserved);
  return calculated + 'px';
}

function applyIframeHeight() {
  const box = document.getElementById('iframeBox');
  if (box) box.style.height = getIframeHeight();
}

// =====================================================================
// FIX: Card max-width in landscape via direct style (media queries
// sometimes don't fire fast enough on Android Chrome PWA)
// =====================================================================
function applyCardWidth() {
  const card = document.querySelector('.crex-card');
  if (!card) return;
  const isLandscape = window.innerWidth > window.innerHeight;

  const widths = {
    phone:  isLandscape ? '92vw' : '',
    tablet: isLandscape ? '95vw' : '',
    pc:     isLandscape ? '97vw' : '',
  };
  card.style.maxWidth = widths[currentMode] || '';
}

function applyMode(mode) {
  const container = document.getElementById('appContainer');
  container.classList.remove('mode-phone', 'mode-tablet', 'mode-pc');
  container.classList.add(`mode-${mode}`);
  currentMode = mode;
  localStorage.setItem('displayMode', mode);
  applyCardWidth();
  applyIframeHeight();

  const card = document.querySelector('.crex-card');
  if (card) {
    card.style.transform = 'scale(0.99)';
    setTimeout(() => { if(card) card.style.transform = ''; }, 150);
  }
}

// =====================================================================
// FIX: Single reliable orientation/resize handler.
// Uses debounce to avoid multiple rapid fires on Android.
// Also forces iframe repaint to fix blank/frozen frame after rotate.
// =====================================================================
function handleLayoutChange() {
  applyCardWidth();
  applyIframeHeight();

  // Force iframe repaint — Android Chrome sometimes freezes iframe on rotate
  const iframe = document.getElementById('crexFrame');
  if (iframe) {
    iframe.style.opacity = '0.99';
    setTimeout(() => { if(iframe) iframe.style.opacity = '1'; }, 80);
  }
}

function debouncedLayoutChange() {
  clearTimeout(resizeDebounceTimer);
  resizeDebounceTimer = setTimeout(handleLayoutChange, 80);
}

// Both events needed: resize fires on Chrome desktop+Android PWA, orientationchange for older devices
window.addEventListener('resize', debouncedLayoutChange);
window.addEventListener('orientationchange', () => {
  // orientationchange fires BEFORE dimensions update, so delay
  setTimeout(handleLayoutChange, 150);
  setTimeout(handleLayoutChange, 400); // second pass ensures toolbar retraction is done
});

// Modern API: screen orientation change (most reliable on Android Chrome)
if (screen.orientation) {
  screen.orientation.addEventListener('change', () => {
    setTimeout(handleLayoutChange, 150);
  });
}

// ========== THEME ==========
function setTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light-mode');
    localStorage.setItem('carelessTheme', 'light');
    const badge = document.getElementById('themeBadge');
    if (badge) badge.innerText = 'LIGHT';
  } else {
    document.body.classList.remove('light-mode');
    localStorage.setItem('carelessTheme', 'dark');
    const badge = document.getElementById('themeBadge');
    if (badge) badge.innerText = 'DARK';
  }
  updateButtonStyle(isPlaying);
}

function toggleTheme() {
  setTheme(document.body.classList.contains('light-mode') ? 'dark' : 'light');
}

// ========== MODAL ==========
const menuBtn = document.getElementById('menuTrigger');
const modal = document.getElementById('modeModal');
const closeModalBtn = document.getElementById('closeModal');

function openModal()  { modal.classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }

menuBtn.addEventListener('click', openModal);
closeModalBtn.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

document.querySelectorAll('.mode-option').forEach(option => {
  option.addEventListener('click', () => {
    const mode = option.getAttribute('data-mode');
    if (mode) { applyMode(mode); closeModal(); }
  });
});

document.getElementById('themeToggleModal').addEventListener('click', toggleTheme);

// ========== AUDIO COMMENTARY ==========
function getYouTubeId(url) {
  if (!url) return null;
  const cleanUrl = url.replace('m.youtube.com', 'youtube.com');
  const match = cleanUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/live\/)([^&?#]+)/);
  return match ? match[1] : null;
}

function startCommentary() {
  const videoId = getYouTubeId(COMMENTARY_URL);
  if (!videoId) { alert('⚠️ Please update daily YouTube commentary link.'); return; }
  if (audioIframe) audioIframe.remove();
  audioIframe = document.createElement('iframe');
  Object.assign(audioIframe.style, {
    position: 'fixed', bottom: '-100px', left: '-100px',
    width: '1px', height: '1px', opacity: '0',
    pointerEvents: 'none', border: 'none'
  });
  audioIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&disablekb=1&modestbranding=1&rel=0&playsinline=1`;
  audioIframe.allow = 'autoplay; encrypted-media';
  document.body.appendChild(audioIframe);
  isPlaying = true;
  updateButtonStyle(true);
}

function stopCommentary() {
  if (audioIframe) { audioIframe.remove(); audioIframe = null; }
  isPlaying = false;
  updateButtonStyle(false);
}

function toggleCommentary() { isPlaying ? stopCommentary() : startCommentary(); }

function updateButtonStyle(playing) {
  const btn = document.getElementById('commentaryBtn');
  if (!btn) return;
  if (playing) {
    btn.classList.add('playing');
    btn.innerHTML = '🎧 ON AIR';
    btn.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ffd700';
    btn.style.color = '#0a0a0a';
  } else {
    btn.classList.remove('playing');
    btn.innerHTML = '🎧 AUDIO';
    btn.style.backgroundColor = '';
    btn.style.color = 'var(--accent)';
  }
}

// ========== INIT ==========
window.onload = () => {
  const savedMode = localStorage.getItem('displayMode');
  applyMode(['phone','tablet','pc'].includes(savedMode) ? savedMode : 'phone');

  const savedTheme = localStorage.getItem('carelessTheme');
  setTheme(savedTheme === 'light' ? 'light' : 'dark');

  // micro-interactions
  document.querySelectorAll('.commentary-btn-header, .watch-live-btn, .reload-btn, .menu-trigger').forEach(btn => {
    ['touchstart','mousedown'].forEach(ev => btn.addEventListener(ev, () => btn.style.transform = 'scale(0.97)', {passive:true}));
    ['touchend','mouseup','touchcancel','mouseleave'].forEach(ev => btn.addEventListener(ev, () => btn.style.transform = ''));
  });

  // Initial layout fix
  handleLayoutChange();
};

window.addEventListener('beforeunload', () => { if (audioIframe) audioIframe.remove(); });
window.toggleCommentary = toggleCommentary;
</script>
</body>
</html>
